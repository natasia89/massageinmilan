<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massage in Milan by Natasia</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  color:white;
  font-family:'Poppins', sans-serif;

  background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
  url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?q=80&w=1920&auto=format');
  background-size:cover;
  background-attachment:fixed;
}

/* GOLD TEXT */
h1,h2,h3 {
  font-family:'Playfair Display', serif;
  color:#d4af37;
  letter-spacing:1px;
}

/* 3D */
#bg {
  position: fixed;
  top:0;
  left:0;
  z-index:-1;
  opacity:0.2;
}

nav, .hero, .section { position:relative; z-index:2; }

nav {
  display:flex;
  justify-content:space-between;
  padding:20px;
}

/* HERO */
.hero {
  height:100vh;
  text-align:center;
  padding-top:120px;
}

/* BUTTON */
button {
  padding:12px 25px;
  border-radius:30px;
  border:1px solid #d4af37;
  color:#d4af37;
  background:transparent;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  background:#d4af37;
  color:black;
  box-shadow:0 0 20px #d4af37;
}

/* SECTION */
.section {
  padding:60px;
  text-align:center;
}

/* GRID */
.grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

/* CARD PREMIUM */
.card {
  width:280px;
  margin:15px;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  cursor:pointer;
  transition:0.4s;
  border:1px solid rgba(212,175,55,0.2);
}

.card:hover {
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 30px rgba(212,175,55,0.6);
  border-color:#d4af37;
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3 {
  padding:15px;
}

/* GALLERY */
.gallery img {
  width:160px;
  margin:10px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.gallery img:hover {
  transform:scale(1.1);
  box-shadow:0 0 15px #d4af37;
}

/* POPUP */
.popup {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:25px;
  border-radius:20px;
  z-index:100;
  width:90%;
  max-width:400px;
  border:1px solid #d4af37;
  box-shadow:0 0 30px rgba(212,175,55,0.5);
}

.hidden { display:none; }

input {
  margin:5px;
  padding:10px;
  width:90%;
  border-radius:10px;
  border:none;
}

/* FADE ANIMATION */
.section {
  animation:fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<nav>
  <h1>Massage in Milan</h1>
  <button onclick="scrollToBooking()">Book</button>
</nav>

<section class="hero">
  <h1 class="text-4xl">Massage in Milan</h1>
  <p>by Natasia</p>
  <p>Luxury Experience</p>
  <button onclick="scrollToBooking()">Book Now</button>
</section>

<section class="section">
  <h2>Massage Services</h2>

  <div class="grid">

    <div class="card" onclick="openService('Swedish Massage','Swedish massage uses soft strokes to relax the whole body and improve circulation.')">
      <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?q=80&w=800&auto=format">
      <h3>Swedish Massage</h3>
    </div>

    <div class="card" onclick="openService('Shiatsu Massage','Shiatsu uses finger pressure to balance energy and relieve tension.')">
      <img src="https://images.unsplash.com/photo-1591343395082-e120087004b4?q=80&w=800&auto=format">
      <h3>Shiatsu Massage</h3>
    </div>

    <div class="card" onclick="openService('Thai Combination','Combination of Swedish, Shiatsu and Thai stretching for full recovery.')">
      <img src="https://images.unsplash.com/photo-1600334129128-685c5582fd35?q=80&w=800&auto=format">
      <h3>Thai Combination</h3>
    </div>

  </div>
</section>

<section class="section">
  <h2>Gallery</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?q=80&w=500&auto=format" onclick="openImage(this.src)">
    <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?q=80&w=500&auto=format" onclick="openImage(this.src)">
    <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=500&auto=format" onclick="openImage(this.src)">
  </div>
</section>

<section id="booking" class="section">
<h2>Book Now</h2>

<input id="name" placeholder="Name"><br>
<input id="location" placeholder="Hotel / Villa"><br>
<input id="time" type="datetime-local"><br>

<button onclick="sendBooking()">Confirm Booking</button>

</section>

<div id="popup" class="popup hidden"></div>

<script>

/* 3D */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("bg"),alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);

const torus=new THREE.Mesh(
  new THREE.TorusGeometry(6,1.5,16,100),
  new THREE.MeshBasicMaterial({color:0xd4af37,wireframe:true,opacity:0.3,transparent:true})
);

scene.add(torus);
camera.position.z=20;

function animate(){
  requestAnimationFrame(animate);
  torus.rotation.x+=0.003;
  torus.rotation.y+=0.003;
  renderer.render(scene,camera);
}
animate();

/* FUNCTIONS */
function scrollToBooking(){
  document.getElementById("booking").scrollIntoView({behavior:"smooth"});
}

function openService(title,desc){
let popup=document.getElementById("popup");
popup.innerHTML=`<h2>${title}</h2><p>${desc}</p>
<button onclick="scrollToBooking()">Book</button>
<button onclick="closePopup()">Close</button>`;
popup.classList.remove("hidden");
}

function closePopup(){
document.getElementById("popup").classList.add("hidden");
}

function openImage(src){
let popup=document.getElementById("popup");
popup.innerHTML=`<img src="${src}" style="width:100%"><button onclick="closePopup()">Close</button>`;
popup.classList.remove("hidden");
}

function sendBooking(){
let name=document.getElementById("name").value;
let location=document.getElementById("location").value;
let time=document.getElementById("time").value;

if(!name||!location||!time){
alert("Fill all fields");
return;
}

window.open(`https://wa.me/393713972872?text=Booking:%0A${name}%0A${location}%0A${time}`);
}

</script>

</body>
</html>
